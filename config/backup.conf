PROJECT_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
DEFAULT_SOURCE="$PROJECT_ROOT/tests/data_dummy"
DEFAULT_DEST="$PROJECT_ROOT/backups"
DEFAULT_RESTORE="$PROJECT_ROOT/restore_test"
LOG_FILE="$PROJECT_ROOT/logs/backup.log"
REPORT_FILE="$PROJECT_ROOT/output/laporan.txt"
LOCK_FILE="/tmp/backup_5a.lock"

write_log() {
    local LEVEL="$1"
    local MESSAGE="$2"
    mkdir -p "$(dirname "$LOG_FILE")"
    echo "[$(date '+%Y-%m-%d %H:%M:%S')] [$LEVEL] [User:$USER] [PID:$$] $MESSAGE" | tee -a "$LOG_FILE"
}